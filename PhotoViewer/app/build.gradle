plugins {
    id 'com.android.application'
}

// 서버 주소/토큰은 git 에 올리지 않는 secrets.properties 에서 읽어 BuildConfig 로 넣는다
def secrets = new Properties()
def secretsFile = rootProject.file('secrets.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
}
def secret = { String key, String fallback -> '"' + secrets.getProperty(key, fallback) + '"' }

android {
    namespace 'com.example.photoviewer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.photoviewer'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        buildConfigField 'String', 'LOCAL_URL', secret('LOCAL_URL', 'http://10.0.2.2:8000')
        buildConfigField 'String', 'LOCAL_TOKEN', secret('LOCAL_TOKEN', '')
        buildConfigField 'String', 'REMOTE_URL', secret('REMOTE_URL', '')
        buildConfigField 'String', 'REMOTE_TOKEN', secret('REMOTE_TOKEN', '')
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    // 단위 테스트(JVM)에서는 안드로이드의 org.json 이 비어 있으므로 실제 구현을 넣음
    testImplementation 'org.json:json:20260814'
}
